<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داشبورد تست</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wrap">
    <div class="head">
      <div>
        <h1> داشبورد تست</h1>
        <div class="sub" id="todayLabel"></div>
      </div>
      <div class="badge-streak" title="روزهای پشت سرهم">
        <span class="fire">🔥</span>
        <div>
          <div class="n" id="streakBig">۰</div>
        </div>
      </div>
    </div>

    <div class="countdown glass">
      <div class="big" id="cd-days">--</div>
      <div class="lbl">روز تا ۲۹ اسفند ۱۴۰۵</div>
      <div class="info" id="cd-info"></div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="section-title">📊 نمودار پیشرفت</div>
    <div class="chart-panel glass">
      <canvas id="progressChart" height="220"></canvas>
    </div>

    <div class="section-title">📅 تقویم تست‌ها</div>
    <div class="calendar-panel glass">
      <div class="cal-head">
        <button id="cal-prev">◀ ماه قبل</button>
        <div class="cal-title" id="cal-title"></div>
        <button id="cal-next">ماه بعد ▶</button>
      </div>
      <div class="cal-weekdays">
        <span>ش</span><span>ی</span><span>د</span><span>س</span><span>چ</span><span>پ</span><span>ج</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
            <div class="cal-legend">
        <span>کمتر</span>
        <div class="legend-cell heat-0"></div>
        <div class="legend-cell heat-1"></div>
        <div class="legend-cell heat-2"></div>
        <div class="legend-cell heat-3"></div>
        <div class="legend-cell heat-4"></div>
        <span>بیشتر</span>
      </div>
    </div>

    <div class="section-title">📚 درس‌ها · هدف داینامیک</div>
    <div class="cards" id="cards"></div>

    <div class="section-title">✍️ ثبت تست</div>
    <div class="form-grid glass">
      <div>
        <label>درس</label>
        <select id="f-lesson"></select>
      </div>
      <div>
        <label>تعداد تست</label>
        <input type="number" id="f-done" min="1" placeholder="مثلاً ۳۰" inputmode="numeric">
      </div>
      <div>
        <label>تاریخ (از تقویم انتخاب کن)</label>
        <input type="text" id="f-date" readonly style="cursor:pointer; text-align:center; direction:ltr;">
      </div>
<div style="display:flex; gap:10px;">
  <button id="btn-add" style="flex:1;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
    ثبت
  </button>
  <button id="btn-export" class="btn-export">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="7 10 12 15 17 10"></polyline>
      <line x1="12" y1="15" x2="12" y2="3"></line>
    </svg>
    خروجی
  </button>
  <label class="btn-import">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="17 8 12 3 7 8"></polyline>
      <line x1="12" y1="3" x2="12" y2="15"></line>
    </svg>
    ورود
    <input type="file" accept=".csv" hidden id="f-import">
  </label>
</div>

    <div class="section-title">📝 تاریخچه</div>
    <div class="logs" id="logs"></div>
  </div>

  <div class="toast" id="toast">✅ ثبت شد</div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
