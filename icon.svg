<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#070b1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  
  <!-- پس‌زمینه -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- دایره‌ی هدف -->
  <circle cx="256" cy="220" r="120" fill="none" stroke="url(#accent)" stroke-width="16" opacity="0.9"/>
  <circle cx="256" cy="220" r="75" fill="none" stroke="url(#accent)" stroke-width="14" opacity="0.7"/>
  <circle cx="256" cy="220" r="35" fill="url(#accent)"/>
  
  <!-- چک‌مارک تست -->
  <path d="M 200 220 L 245 265 L 320 175" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- ستاره جرقه‌ها -->
  <circle cx="390" cy="120" r="12" fill="#22d3ee" opacity="0.9"/>
  <circle cx="130" cy="150" r="8" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="370" cy="380" r="10" fill="#eab308" opacity="0.8"/>
</svg>